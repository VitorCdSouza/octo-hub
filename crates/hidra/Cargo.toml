[package]
name = "hidra"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Keyboard core of Hidra (github.com/VitorCdSouza/hidra): VIA protocol, keycodes, macros and modes for the GMK70"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
